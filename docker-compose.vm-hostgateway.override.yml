# Cloud VM workaround when Compose bridge DNS to postgresql/weaviate times out.
# Use host-published ports via host.docker.internal (see PR #83 setup notes).
x-llm-via-host-proxy: &llm-via-host-proxy
  LLM_API_URL: http://host.docker.internal:12345/v1
  OPENAI_BASE_URL: http://host.docker.internal:12345/v1

services:
  rag-service:
    ports: !override
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/askpdf
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/test_askpdf
      WEAVIATE_URL: http://host.docker.internal:8080
      LANGGRAPH_RUNTIME_URL: http://host.docker.internal:8100
      HERMES_RUNTIME_URL: http://host.docker.internal:8200
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      <<: *llm-via-host-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://localhost:8000/ready && curl -f http://host.docker.internal:8080/v1/.well-known/ready",
        ]

  db-migrate:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/askpdf
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/test_askpdf
      WEAVIATE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

  langgraph-runtime:
    ports:
      - "8100:8100"
    environment:
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/runtime_checkpoints
      AGENT_RUNTIME_EXECUTION_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/runtime_checkpoints
      MCP_LOOPBACK_URL: http://host.docker.internal:8000/internal/mcp/
      <<: *llm-via-host-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runtime-db-migrate:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/runtime_checkpoints
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/runtime_checkpoints
      AGENT_RUNTIME_EXECUTION_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/runtime_checkpoints
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runtime-checkpoint-db-init:
    command:
      - /bin/sh
      - -c
      - >-
        until pg_isready -h host.docker.internal -U postgres -d askpdf; do sleep 1; done;
        if [ "$$(psql -h host.docker.internal -U postgres -d askpdf -tAc "SELECT 1 FROM pg_database WHERE datname='runtime_checkpoints'")" != "1" ]; then
          createdb -h host.docker.internal -U postgres runtime_checkpoints;
        fi
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hermes:
    ports:
      - "8642:8642"
    environment:
      <<: *llm-via-host-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    environment:
      ASKPDF_BACKEND_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hermes-runtime:
    ports:
      - "8200:8200"
    environment:
      HERMES_API_URL: http://host.docker.internal:8642
      ASKPDF_MCP_URL: http://host.docker.internal:8000/internal/mcp/
      ASKPDF_MCP_HEALTH_URL: http://host.docker.internal:8000/health
      <<: *llm-via-host-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
