name: CI

on:
  pull_request:
    branches:
      - main
      - feature/hermes
  push:
    branches:
      - main
      - feature/hermes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
  WEAVIATE_HYBRID_ALPHA: "0.7"
  QUERY_DEFAULTS_LIMIT: "20"
  LOCAL_EMBEDDING_MODEL: BAAI/bge-m3
  LOCAL_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
  EMBEDDING_DEVICE: cpu
  RERANKER_DEVICE: cpu
  SELKIES_CLIPBOARD_ENABLED: "true"
  SELKIES_CLIPBOARD_BRIDGE_ENABLED: "true"
  SELKIES_GAMEPAD_ENABLED: "false"
  SELKIES_UI_SIDEBAR_SHOW_GAMEPADS: "false"
  SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE: "false"
  SELKIES_UI_SIDEBAR_SHOW_SHARING: "false"
  SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
  HERMES_UPSTREAM_REVISION: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  ASKPDF_BUILDX_CACHE_DIR: /tmp/.buildx-cache
  ASKPDF_CI_IMAGE_TAG: ${{ github.sha }}
  ASKPDF_CI_IMAGE_MANIFEST: /tmp/askpdf-ci-images.txt

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect optional image rebuilds
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            browser_capture:
              - 'browser_capture/**'

      - name: Set optional compose service flags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ASKPDF_CI_BUILD_FRONTEND=1" >> "$GITHUB_ENV"
            echo "ASKPDF_CI_BUILD_BROWSER_CAPTURE=1" >> "$GITHUB_ENV"
          else
            if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
              echo "ASKPDF_CI_BUILD_FRONTEND=1" >> "$GITHUB_ENV"
            else
              echo "ASKPDF_CI_BUILD_FRONTEND=0" >> "$GITHUB_ENV"
            fi
            if [ "${{ steps.changes.outputs.browser_capture }}" = "true" ]; then
              echo "ASKPDF_CI_BUILD_BROWSER_CAPTURE=1" >> "$GITHUB_ENV"
            else
              echo "ASKPDF_CI_BUILD_BROWSER_CAPTURE=0" >> "$GITHUB_ENV"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore BuildKit cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.buildx-cache
          key: askpdf-buildx-${{ hashFiles('rag_service/Dockerfile', 'rag_service/Dockerfile.test', 'rag_service/requirements.txt', 'rag_service/requirements-dev.txt', 'langgraph_runtime/Dockerfile', 'langgraph_runtime/Dockerfile.test', 'hermes_runtime/Dockerfile', 'hermes_runtime/Dockerfile.gateway', 'frontend/Dockerfile', 'browser_capture/Dockerfile', 'docker-compose.yml', 'docker-compose.ci.yml', 'docker-compose.test.yml', 'docker-compose.test.ci.yml', 'docker-compose.runtime-integration.yml', 'docker-compose.runtime-integration.ci.yml', 'scripts/ci_docker_build.sh') }}
          restore-keys: |
            askpdf-buildx-

      - name: Build Docker images
        run: bash scripts/ci_docker_build.sh

      - name: Verify framework image boundaries
        run: bash scripts/ci_verify_image_boundaries.sh

      - name: Publish images for downstream jobs
        run: bash scripts/ci_docker_publish.sh

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: askpdf-ci-image-manifest
          path: /tmp/askpdf-ci-images.txt
          retention-days: 2

      - name: Check diff hygiene
        run: git diff --check

      - name: Save BuildKit cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/.buildx-cache
          key: askpdf-buildx-${{ hashFiles('rag_service/Dockerfile', 'rag_service/Dockerfile.test', 'rag_service/requirements.txt', 'rag_service/requirements-dev.txt', 'langgraph_runtime/Dockerfile', 'langgraph_runtime/Dockerfile.test', 'hermes_runtime/Dockerfile', 'hermes_runtime/Dockerfile.gateway', 'frontend/Dockerfile', 'browser_capture/Dockerfile', 'docker-compose.yml', 'docker-compose.ci.yml', 'docker-compose.test.yml', 'docker-compose.test.ci.yml', 'docker-compose.runtime-integration.yml', 'docker-compose.runtime-integration.ci.yml', 'scripts/ci_docker_build.sh') }}

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: docker-build
    env:
      ASKPDF_SKIP_RUNTIME_COMPOSE_BUILD: "1"
      ASKPDF_SKIP_TEST_RUNNER_BUILD: "1"
      ASKPDF_RAG_IMAGE_SMOKE_TAG: askpdf-runtime-control-plane
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download image manifest
        uses: actions/download-artifact@v4
        with:
          name: askpdf-ci-image-manifest
          path: /tmp

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load pre-built CI images
        run: |
          mv /tmp/askpdf-ci-images.txt "${ASKPDF_CI_IMAGE_MANIFEST}"
          bash scripts/ci_docker_load.sh

      - name: Create clean CI environment
        run: cp .env.ci .env

      - name: Run Docker test runner
        run: ./run_tests.sh

      - name: Reclaim disk before LangGraph runtime proof
        run: bash scripts/ci_reclaim_disk.sh

      - name: Run mandatory LangGraph runtime proof
        timeout-minutes: 35
        run: ./run_tests.sh --langgraph-runtime

      - name: Stop test services
        if: always()
        run: docker compose -p askpdf-test -f docker-compose.test.yml -f docker-compose.test.ci.yml down --volumes --remove-orphans

  hermes-runtime-proof:
    name: Hermes runtime proof
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 45
    env:
      ASKPDF_RUNTIME_TEST_PROJECT_NAME: askpdf-hermes-ci
      ASKPDF_SKIP_RUNTIME_COMPOSE_BUILD: "1"
      ASKPDF_SKIP_TEST_RUNNER_BUILD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download image manifest
        uses: actions/download-artifact@v4
        with:
          name: askpdf-ci-image-manifest
          path: /tmp

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load pre-built CI images
        run: |
          mv /tmp/askpdf-ci-images.txt "${ASKPDF_CI_IMAGE_MANIFEST}"
          bash scripts/ci_docker_load.sh

      - name: Create clean CI environment
        run: cp .env.ci .env

      - name: Run deterministic Hermes proof
        run: ./run_tests.sh --hermes-runtime

      - name: Stop Hermes proof services
        if: always()
        run: |
          docker compose -p askpdf-hermes-ci \
            -f docker-compose.runtime-integration.yml \
            -f docker-compose.runtime-integration.ci.yml \
            down --volumes --remove-orphans