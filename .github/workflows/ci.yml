name: CI

on:
  pull_request:
    branches:
      - main
      - feature/hermes
  push:
    branches:
      - main
      - feature/hermes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
  WEAVIATE_HYBRID_ALPHA: "0.7"
  QUERY_DEFAULTS_LIMIT: "20"
  LOCAL_EMBEDDING_MODEL: BAAI/bge-m3
  LOCAL_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
  EMBEDDING_DEVICE: cpu
  RERANKER_DEVICE: cpu
  SELKIES_CLIPBOARD_ENABLED: "true"
  SELKIES_CLIPBOARD_BRIDGE_ENABLED: "true"
  SELKIES_GAMEPAD_ENABLED: "false"
  SELKIES_UI_SIDEBAR_SHOW_GAMEPADS: "false"
  SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE: "false"
  SELKIES_UI_SIDEBAR_SHOW_SHARING: "false"
  SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
  HERMES_UPSTREAM_REVISION: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  ASKPDF_BUILDX_CACHE_DIR: /tmp/.buildx-cache

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore BuildKit cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.buildx-cache
          key: askpdf-buildx-${{ hashFiles('rag_service/Dockerfile', 'rag_service/Dockerfile.test', 'rag_service/requirements.txt', 'rag_service/requirements-dev.txt', 'langgraph_runtime/Dockerfile', 'langgraph_runtime/Dockerfile.test', 'hermes_runtime/Dockerfile', 'frontend/Dockerfile', 'browser_capture/Dockerfile', 'docker-compose.yml', 'docker-compose.ci.yml', 'docker-compose.test.yml', 'docker-compose.test.ci.yml', 'docker-compose.runtime-integration.yml') }}
          restore-keys: |
            askpdf-buildx-

      - name: Create clean CI environment
        run: |
          cp .env.ci .env

      - name: Build Docker images
        run: bash scripts/ci_docker_build.sh

      - name: Verify framework image boundaries
        run: bash scripts/ci_verify_image_boundaries.sh

      - name: Check diff hygiene
        run: git diff --check

      - name: Save BuildKit cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/.buildx-cache
          key: askpdf-buildx-${{ hashFiles('rag_service/Dockerfile', 'rag_service/Dockerfile.test', 'rag_service/requirements.txt', 'rag_service/requirements-dev.txt', 'langgraph_runtime/Dockerfile', 'langgraph_runtime/Dockerfile.test', 'hermes_runtime/Dockerfile', 'frontend/Dockerfile', 'browser_capture/Dockerfile', 'docker-compose.yml', 'docker-compose.ci.yml', 'docker-compose.test.yml', 'docker-compose.test.ci.yml', 'docker-compose.runtime-integration.yml') }}

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: docker-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore BuildKit cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.buildx-cache
          key: askpdf-buildx-${{ hashFiles('rag_service/Dockerfile', 'rag_service/Dockerfile.test', 'rag_service/requirements.txt', 'rag_service/requirements-dev.txt', 'langgraph_runtime/Dockerfile', 'langgraph_runtime/Dockerfile.test', 'hermes_runtime/Dockerfile', 'frontend/Dockerfile', 'browser_capture/Dockerfile', 'docker-compose.yml', 'docker-compose.ci.yml', 'docker-compose.test.yml', 'docker-compose.test.ci.yml', 'docker-compose.runtime-integration.yml') }}
          restore-keys: |
            askpdf-buildx-

      - name: Create clean CI environment
        run: |
          cp .env.ci .env

      - name: Warm Docker images from CI cache
        run: bash scripts/ci_docker_build.sh

      - name: Run Docker test runner
        run: ./run_tests.sh

      - name: Collect control-plane tests
        run: |
          docker compose -p askpdf-test -f docker-compose.test.yml -f docker-compose.test.ci.yml \
            run --rm -e PYTHONPATH=/workspace:/app --entrypoint pytest \
            test-runner --collect-only -q /app/tests

      - name: Collect LangGraph runtime tests
        run: |
          docker compose -p askpdf-runtime-collection \
            -f docker-compose.runtime-integration.yml \
            run --rm --no-deps --entrypoint pytest runtime-test-runner \
            --collect-only -q /app/langgraph_runtime/tests

      - name: Reclaim disk before LangGraph runtime proof
        run: |
          docker compose -p askpdf-test -f docker-compose.test.yml down --volumes --remove-orphans || true
          docker compose -p askpdf-runtime-collection -f docker-compose.runtime-integration.yml down --volumes --remove-orphans || true
          docker volume prune -f || true
          df -h

      - name: Run mandatory LangGraph runtime proof
        timeout-minutes: 35
        run: ./run_tests.sh --langgraph-runtime

      - name: Stop test services
        if: always()
        run: docker compose -p askpdf-test -f docker-compose.test.yml down --volumes --remove-orphans

  hermes-runtime-proof:
    name: Hermes runtime proof
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 45
    env:
      ASKPDF_RUNTIME_TEST_PROJECT_NAME: askpdf-hermes-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore BuildKit cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.buildx-cache
          key: askpdf-buildx-${{ hashFiles('rag_service/Dockerfile', 'rag_service/Dockerfile.test', 'rag_service/requirements.txt', 'rag_service/requirements-dev.txt', 'langgraph_runtime/Dockerfile', 'langgraph_runtime/Dockerfile.test', 'hermes_runtime/Dockerfile', 'frontend/Dockerfile', 'browser_capture/Dockerfile', 'docker-compose.yml', 'docker-compose.ci.yml', 'docker-compose.test.yml', 'docker-compose.test.ci.yml', 'docker-compose.runtime-integration.yml') }}
          restore-keys: |
            askpdf-buildx-

      - name: Create clean CI environment
        run: |
          cp .env.ci .env

      - name: Warm Docker images from CI cache
        run: bash scripts/ci_docker_build.sh

      - name: Run deterministic Hermes proof
        run: ./run_tests.sh --hermes-runtime

      - name: Stop Hermes proof services
        if: always()
        run: docker compose -p askpdf-hermes-ci -f docker-compose.runtime-integration.yml down --volumes --remove-orphans