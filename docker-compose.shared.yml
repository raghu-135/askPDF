x-rag-service-build: &rag-service-build
  context: .
  dockerfile: rag_service/Dockerfile
  args:
    DOWNLOAD_LOCAL_MODELS: 'false'

x-langgraph-runtime-build: &langgraph-runtime-build
  context: .
  dockerfile: langgraph_runtime/Dockerfile

x-hermes-runtime-build: &hermes-runtime-build
  context: .
  dockerfile: hermes_runtime/Dockerfile

x-postgres-16: &postgres-16
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: askpdf
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres

x-weaviate-image: &weaviate-image cr.weaviate.io/semitechnologies/weaviate:1.36.2

x-weaviate-base-env: &weaviate-base-env
  QUERY_DEFAULTS_LIMIT: 20
  AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
  PERSISTENCE_DATA_PATH: /var/lib/weaviate
  DEFAULT_VECTORIZER_MODULE: none
  ENABLE_API_BASED_MODULES: 'true'
  CLUSTER_HOSTNAME: node1

x-healthcheck-postgres-product: &healthcheck-postgres-product
  test:
    - CMD-SHELL
    - pg_isready -U postgres -d askpdf
  interval: 5s
  timeout: 5s
  retries: 5
  start_period: 10s

x-healthcheck-postgres-integration: &healthcheck-postgres-integration
  test:
    - CMD-SHELL
    - pg_isready -U postgres -d askpdf
  interval: 5s
  timeout: 5s
  retries: 12

x-healthcheck-weaviate-product: &healthcheck-weaviate-product
  test:
    - CMD-SHELL
    - wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1
  interval: 30s
  timeout: 10s
  retries: 5

x-healthcheck-weaviate-integration: &healthcheck-weaviate-integration
  test:
    - CMD-SHELL
    - wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1
  interval: 10s
  timeout: 5s
  retries: 12

x-healthcheck-hermes-gateway: &healthcheck-hermes-gateway
  test:
    - CMD
    - curl
    - -f
    - http://localhost:8642/health
  interval: 10s
  timeout: 5s
  retries: 30

x-healthcheck-hermes-runtime: &healthcheck-hermes-runtime
  test:
    - CMD
    - curl
    - -f
    - http://localhost:8200/readyz
  interval: 10s
  timeout: 5s
  retries: 12

x-healthcheck-langgraph-startupz: &healthcheck-langgraph-startupz
  test:
    - CMD
    - curl
    - -f
    - http://localhost:8100/startupz
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-healthcheck-rag-product: &healthcheck-rag-product
  test:
    - CMD
    - sh
    - -c
    - curl -f http://localhost:8000/health && curl -f http://weaviate:8080/v1/.well-known/ready
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

x-healthcheck-rag-integration: &healthcheck-rag-integration
  test:
    - CMD
    - curl
    - -f
    - http://localhost:8000/health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s