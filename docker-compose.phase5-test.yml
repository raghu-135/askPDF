services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: askpdf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askpdf"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - phase5_postgres_data:/var/lib/postgresql/data

  runtime-checkpoint-db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        until pg_isready -h postgresql -U postgres -d askpdf; do sleep 1; done;
        if [ "$$(psql -h postgresql -U postgres -d askpdf -tAc "SELECT 1 FROM pg_database WHERE datname='runtime_checkpoints'")" != "1" ]; then
          createdb -h postgresql -U postgres runtime_checkpoints;
        fi

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.2
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_API_BASED_MODULES: "true"
      CLUSTER_HOSTNAME: phase5-test
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - phase5_weaviate_data:/var/lib/weaviate

  rag-service:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "5"
      ASKPDF_AGENT_CHECKPOINTER: postgres
      AGENT_RUNTIME_EXTERNAL_ENABLED: "true"
      LANGGRAPH_RUNTIME_URL: http://langgraph-runtime:8100
      WEAVIATE_URL: http://weaviate:8080
      MCP_TRANSPORT: in_process
      MCP_LOOPBACK_URL: http://127.0.0.1:8000/internal/mcp/
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:1234/v1}
      ASKPDF_REPO_DIR: /workspace
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgresql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      runtime-checkpoint-db-init:
        condition: service_completed_successfully
      weaviate:
        condition: service_healthy
    volumes:
      - ./rag_service:/app
      - .:/workspace:ro
      - phase5_product_data:/static
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  db-migrate:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    command: ["python", "-m", "app.db.migrate"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "5"
      RUN_DB_MIGRATIONS: "true"
      LOCAL_EMBEDDING_MODEL: BAAI/bge-m3
      LOCAL_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./rag_service:/app

  langgraph-runtime:
    build:
      context: ./rag_service
      dockerfile: runtime_service/Dockerfile
    environment:
      LOG_LEVEL: INFO
      ASKPDF_AGENT_CHECKPOINTER: postgres
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints
      ASKPDF_AGENT_CHECKPOINTER_SETUP: "true"
      ASKPDF_AGENT_CHECKPOINTER_ALLOW_MEMORY_FALLBACK: "false"
      MCP_TRANSPORT: loopback_http
      MCP_LOOPBACK_URL: http://rag-service:8000/internal/mcp/
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:1234/v1}
      AGENT_RUNTIME_EXTERNAL_ENABLED: "true"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      rag-service:
        condition: service_healthy
      runtime-checkpoint-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  test-runner:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    entrypoint: ["python", "scripts/run_tests.py"]
    environment:
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "5"
      AGENT_RUNTIME_EXTERNAL_ENABLED: "true"
      LANGGRAPH_RUNTIME_URL: http://langgraph-runtime:8100
      WEAVIATE_URL: http://weaviate:8080
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:1234/v1}
      ASKPDF_REPO_DIR: /workspace
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      langgraph-runtime:
        condition: service_healthy
    volumes:
      - ./rag_service:/app
      - .:/workspace:ro
      - phase5_test_data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  phase5_postgres_data:
  phase5_weaviate_data:
  phase5_product_data:
  phase5_test_data:
