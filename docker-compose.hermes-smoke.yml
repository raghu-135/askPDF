name: askpdf-hermes-smoke

services:
  hermes-real:
    profiles: ["real-hermes"]
    build:
      context: https://github.com/NousResearch/hermes-agent.git#bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
    env_file:
      - ./hermes_runtime/smoke.env
    command: ["gateway"]
    volumes:
      - ./hermes_runtime/smoke-config.yaml:/opt/data/config.yaml:ro
      - ./hermes_runtime/smoke.env:/opt/data/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      fake-llm:
        condition: service_healthy

  fake-llm:
    profiles: ["real-hermes"]
    build:
      context: ./rag_service
      dockerfile: Dockerfile.fake-llm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v1/models"]
      interval: 2s
      timeout: 2s
      retries: 20

  hermes-runtime-real:
    profiles: ["real-hermes"]
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile
    command:
      - sh
      - -c
      - python -c 'from hermes_runtime.profile_manager import render_bootstrap_config; render_bootstrap_config()' && uvicorn hermes_runtime.main:app --host 0.0.0.0 --port 8200
    environment:
      HERMES_API_URL: http://hermes-real:8642
      ASKPDF_MCP_URL: http://rag-service:8000/internal/mcp/
      ASKPDF_MCP_HEALTH_URL: http://rag-service:8000/health
      ASKPDF_MCP_REQUIRED: "false"
      HERMES_RUNTIME_VERSION: bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
      HERMES_RUNTIME_STATE_PATH: /var/lib/hermes/runtime-state.json
      HERMES_RUNTIME_STORAGE_BACKEND: file
      HERMES_RUNTIME_WORKERS: "1"
      HERMES_MODEL: hermes-runtime-deterministic
      HERMES_MODEL_PROVIDER: lmstudio
      HERMES_MODEL_CONTEXT_LENGTH: "32768"
      HERMES_UPSTREAM_REVISION: bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
      HERMES_PROFILE_ROOT: /opt/data/profiles
      HERMES_PROFILE_UID: "10000"
      HERMES_PROFILE_GID: "10000"
      HERMES_RUN_PROFILE_MAX_AGE_SECONDS: "86400"
      HERMES_RUN_PROFILE_SWEEP_INTERVAL_SECONDS: "60"
      LLM_API_URL: http://fake-llm:9000/v1
      MCP_TRANSPORT: loopback_http
      MCP_LOOPBACK_URL: http://rag-service:8000/internal/mcp/
      MCP_REQUEST_TIMEOUT_SECONDS: "120"
      MCP_OTEL_ENABLED: "false"
      DEEP_AGENT_HERMES_MAX_MODEL_CALLS: "100"
      DEEP_AGENT_HERMES_MAX_MODEL_TOKENS: "100000"
      DEEP_AGENT_HERMES_MAX_TOOL_CALLS: "100"
      DEEP_AGENT_HERMES_MAX_ACTIVE_RUNTIME_MS: "120000"
      DEEP_AGENT_HERMES_MAX_DURATION_MS: "120000"
      DEEP_AGENT_HERMES_MAX_OUTPUT_CHARS: "12000"
      DEEP_AGENT_HERMES_MAX_EVENT_COUNT: "200"
      AGENT_RUNTIME_LEASE_SECONDS: "120"
      AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS: "30"
      AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS: "300"
      AGENT_RUNTIME_READ_TIMEOUT_SECONDS: "600"
      AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS: "3"
      AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS: "1"
      AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS: "30"
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS: "0.5"
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES: "8192"
      AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS: "30"
      AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS: "30"
      AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS: "30"
      AGENT_EVENT_POLL_INTERVAL_SECONDS: "1"
      AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS: "12"
      AGENT_CANCELLATION_POLL_INTERVAL_SECONDS: "0.5"
      AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS: "30"
      AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS: "30"
      AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS: "90"
      AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO: "0.1"
      AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS: "30"
      AGENT_RUNTIME_RECOVERY_BATCH_SIZE: "10"
      NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS: "2000"
      NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS: "2000"
      HERMES_API_TOKEN: 7dd5c723b63643e38fc0ccae72a7bf2a8f65c61ad44d4de88e08079b157a55c
      HERMES_RUNTIME_TOKEN: hermes-runtime-smoke-token-012345678901234567890123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      hermes-real:
        condition: service_healthy
    volumes:
      - real_hermes_gateway_state_v2:/var/lib/hermes
      - real_hermes_profile_state_v2:/opt/data

  real-hermes-smoke-test:
    profiles: ["real-hermes"]
    build:
      context: .
      dockerfile: rag_service/Dockerfile.test
    working_dir: /app
    environment:
      PYTHONPATH: /app
      HERMES_RUNTIME_REAL_SMOKE: "true"
      COMPOSE_PROFILES: "hermes"
      HERMES_RUNTIME_URL: http://hermes-runtime-real:8200
      HERMES_RUNTIME_TOKEN: hermes-runtime-smoke-token-012345678901234567890123
      MCP_EXECUTION_CONTEXT_SECRET: hermes-smoke-mcp-context-secret-012345678901234567
      HERMES_MODEL_CONTEXT_LENGTH: "32768"
      HERMES_MODEL_PROVIDER: lmstudio
      HERMES_UPSTREAM_REVISION: bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
      LLM_API_URL: http://fake-llm:9000/v1
      DEFAULT_TOKEN_BUDGET: "8192"
      REPLANS_LIMIT: "10"
      MAX_CUSTOM_INSTRUCTIONS_CHARS: "2000"
      MAX_SYSTEM_ROLE_CHARS: "500"
      MAX_TOOL_INSTRUCTION_CHARS: "500"
      MAX_ITERATIONS_SUFFICIENT_COVERAGE: "2"
      MAX_ITERATIONS_PROBABLY_SUFFICIENT_COVERAGE: "4"
      WEB_SEARCH_ITERATION_BONUS: "2"
      LOCAL_EMBEDDING_MODEL: BAAI/bge-m3
      LOCAL_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS: "30"
      AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS: "300"
      AGENT_RUNTIME_READ_TIMEOUT_SECONDS: "600"
      AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS: "3"
      AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS: "1"
      AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS: "30"
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS: "0.5"
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES: "8192"
      DEEP_AGENT_HERMES_MAX_MODEL_CALLS: "100"
      DEEP_AGENT_HERMES_MAX_MODEL_TOKENS: "100000"
      DEEP_AGENT_HERMES_MAX_TOOL_CALLS: "100"
      DEEP_AGENT_HERMES_MAX_ACTIVE_RUNTIME_MS: "120000"
      DEEP_AGENT_HERMES_MAX_DURATION_MS: "120000"
      DEEP_AGENT_HERMES_MAX_OUTPUT_CHARS: "12000"
      DEEP_AGENT_HERMES_MAX_EVENT_COUNT: "200"
    command: ["pytest", "--noconftest", "-q", "tests/test_real_hermes_container_smoke_pytest.py"]
    depends_on:
      hermes-runtime-real:
        condition: service_healthy

volumes:
  real_hermes_gateway_state_v2:
  real_hermes_profile_state_v2:
