# Optional laptop dev: Next.js hot reload with bind-mounted frontend sources.
# Not auto-loaded — pass explicitly when you want dev mode:
#   docker compose -f docker-compose.yml -f docker-compose.development.override.yml up --build
services:
  frontend:
    build:
      target: dev
    environment:
      NODE_ENV: development
      ASKPDF_BACKEND_URL: http://rag-service:8000
    command: 'sh -lc "if [ ! -x node_modules/.bin/next ] || [ package-lock.json -nt node_modules/.package-lock.json ] || [
      ! -d node_modules/@tanstack/react-virtual ] || [ ! -d node_modules/@next/bundle-analyzer ]; then npm ci --no-audit --no-fund;
      fi; npm run dev"

      '
    volumes:
    - ./scripts/docker_load_env_secrets.sh:/opt/askpdf/docker_load_env_secrets.sh:ro
    - env_secrets:/secrets:ro
    - ./frontend:/app
    - /app/node_modules
    - frontend_next:/app/.next
volumes:
  frontend_next: null