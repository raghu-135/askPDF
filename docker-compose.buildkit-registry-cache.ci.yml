# CI overlay: export/import BuildKit layers via GHCR (mode=max).
# Requires ASKPDF_BUILDKIT_CACHE_REF in the environment (see scripts/ci_buildkit_cache.sh).
x-askpdf-buildkit-registry-cache-from: &askpdf_buildkit_registry_cache_from
  - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF:?ASKPDF_BUILDKIT_CACHE_REF must be set}
x-askpdf-buildkit-registry-cache-to: &askpdf_buildkit_registry_cache_to
  - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF},mode=max,compression=zstd,ignore-error=true

services:
  rag-service:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  db-migrate:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  langgraph-runtime:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  frontend:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  browser-capture:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  test-runner:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  fake-llm:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  hermes-upstream:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  hermes:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  hermes-runtime:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to
  runtime-test-runner:
    build:
      cache_from: *askpdf_buildkit_registry_cache_from
      cache_to: *askpdf_buildkit_registry_cache_to