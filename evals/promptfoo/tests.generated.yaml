- description: invasion-overview
  vars:
    question_id: invasion-overview
    question: What does the PLOS ONE paper on economic development and biological
      invasions conclude?
    expected_pages:
    - 1
    - 2
    answer_match:
      any_contains: &id001
      - invasion
      - economic
      - trade
      - China
    case_json: '{"id": "invasion-overview", "tier": "smoke", "type": "overview", "suites":
      ["baseline", "sweep_core"], "fixture_files": ["plos-pone-0001208.pdf"], "expected_pages":
      [1, 2], "question": "What does the PLOS ONE paper on economic development and
      biological invasions conclude?", "answer_match": {"any_contains": ["invasion",
      "economic", "trade", "China"]}}'
  assert:
  - type: javascript
    value: context.providerResponse?.metadata?.retrieval_hit === true
  - type: contains-any
    value: *id001
- description: invasion-authors
  vars:
    question_id: invasion-authors
    question: Who is the corresponding author on the China biological invasions paper?
    expected_pages:
    - 1
    answer_match:
      any_contains: &id002
      - Rumei Xu
      - Xu
    case_json: '{"id": "invasion-authors", "tier": "smoke", "type": "fact", "suites":
      ["baseline", "smoke"], "fixture_files": ["plos-pone-0001208.pdf"], "expected_pages":
      [1], "question": "Who is the corresponding author on the China biological invasions
      paper?", "answer_match": {"any_contains": ["Rumei Xu", "Xu"]}}'
  assert:
  - type: javascript
    value: context.providerResponse?.metadata?.retrieval_hit === true
  - type: contains-any
    value: *id002
- description: stats-rules-title
  vars:
    question_id: stats-rules-title
    question: What is the title of the Ten Simple Rules editorial on statistical practice?
    expected_pages:
    - 1
    answer_match:
      any_contains: &id003
      - Ten Simple Rules
      - Statistical Practice
    case_json: '{"id": "stats-rules-title", "tier": "smoke", "type": "overview", "suites":
      ["baseline", "sweep_core", "smoke"], "fixture_files": ["plos-pcbi-1004961.pdf"],
      "expected_pages": [1], "question": "What is the title of the Ten Simple Rules
      editorial on statistical practice?", "answer_match": {"any_contains": ["Ten
      Simple Rules", "Statistical Practice"]}}'
  assert:
  - type: javascript
    value: context.providerResponse?.metadata?.retrieval_hit === true
  - type: contains-any
    value: *id003
- description: wolbachia-virus
  vars:
    question_id: wolbachia-virus
    question: Which virus inhibition mechanism is discussed for Wolbachia in Aedes
      aegypti?
    expected_pages:
    - 1
    - 2
    answer_match:
      any_contains: &id004
      - dengue
    case_json: '{"id": "wolbachia-virus", "tier": "smoke", "type": "fact", "suites":
      ["baseline", "sweep_core", "smoke"], "fixture_files": ["plos-pathogens-1008410.pdf"],
      "expected_pages": [1, 2], "question": "Which virus inhibition mechanism is discussed
      for Wolbachia in Aedes aegypti?", "answer_match": {"any_contains": ["dengue"]}}'
  assert:
  - type: javascript
    value: context.providerResponse?.metadata?.retrieval_hit === true
  - type: contains-any
    value: *id004
- description: out-of-scope-neptune
  vars:
    question_id: out-of-scope-neptune
    question: What is the orbital period of Neptune in Earth years?
    expected_pages: []
    answer_match:
      decline: true
    case_json: '{"id": "out-of-scope-neptune", "tier": "smoke", "type": "out_of_scope",
      "suites": ["baseline", "sweep_core", "smoke"], "fixture_files": ["plos-pone-0001208.pdf"],
      "expected_pages": [], "question": "What is the orbital period of Neptune in
      Earth years?", "answer_match": {"decline": true}}'
  assert:
  - type: javascript
    value: context.providerResponse?.metadata?.retrieval_hit === true
  - type: javascript
    value: '!/(attached documents do not|do not address)/i.test(output)'
