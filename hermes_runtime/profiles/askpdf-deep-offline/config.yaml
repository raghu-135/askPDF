# Managed profile for Hermes Deep Research without external access.
# Pinned to NousResearch/hermes-agent@v0.23.0 (2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19).
_config_version: 52
model:
  default: askpdf-runtime-selected
  provider: custom
  base_url: ${LLM_API_URL}
  context_length: __HERMES_MODEL_CONTEXT_LENGTH__
platforms:
  # The default profile owns the shared listener in multiplex mode. The key
  # remains available for authentication on this profile's /p/<profile>/ path.
  api_server:
    enabled: false
auxiliary:
  title_generation:
    enabled: false
# Runtime MCP registration belongs exclusively to generated per-run profiles.
mcp_servers: {}
