# Hermes configuration pinned to config schema 52 at
# NousResearch/hermes-agent@v0.23.0 (2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19).
# Model/provider credentials are supplied through the project .env file.
_config_version: 52

gateway:
  # The pinned gateway selects one of the immutable Deep Research profiles
  # through /p/<profile>/v1/runs.
  multiplex_profiles: true

model:
  # Product requests always override this with the model selected in askPDF's
  # thread settings. This value exists only to satisfy Hermes startup config.
  default: askpdf-runtime-selected
  provider: custom
  base_url: ${LLM_API_URL}
  # Required when Hermes is enabled. This prevents Hermes from silently
  # assuming its 256k fallback for custom/provider-selected models.
  context_length: __HERMES_MODEL_CONTEXT_LENGTH__

auxiliary:
  free_only: true
  # askPDF owns task/report titles. Hermes title generation runs outside the
  # per-run secret scope in multiplex mode and is intentionally unused.
  title_generation:
    enabled: false

tools:
  tool_search:
    enabled: off

agent:
  disabled_toolsets:
    - terminal
    - skills
    - file

# MCP servers are registered only by isolated generated run profiles, where a
# signed execution-context header is available.
mcp_servers: {}
