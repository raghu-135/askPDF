<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chat web search approval panel fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; font-size: 13px; background: #fafafa; height: 100vh; overflow: hidden; }
      .panel { display: flex; flex-direction: column; height: 100vh; padding: 8px; gap: 8px; }
      .header { flex-shrink: 0; height: 56px; border: 1px solid #ddd; background: #fff; padding: 8px; }
      .transcript { flex: 1 1 auto; min-height: 120px; overflow: auto; border: 1px solid #eee; padding: 8px; background: #fff; }
      .decision {
        flex: 0 0 auto; max-height: 42vh; display: flex; flex-direction: column; border: 1px solid #2196f3;
        border-radius: 4px; background: #fafafa; padding: 0 8px 8px; overflow: hidden;
      }
      .decision-title { text-align: center; color: #666; font-weight: 700; padding: 8px 0; }
      .decision-body { display: flex; flex-direction: column; gap: 8px; }
      .composer { flex-shrink: 0; height: 72px; border: 1px solid #ddd; background: #fff; padding: 8px; }
      button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc; background: #1976d2; color: #fff; cursor: pointer; margin-right: 8px; }
      button.outline { background: #fff; color: #333; }
      .summary { font-size: 14px; line-height: 1.35; }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="header">Chat header</div>
      <div class="transcript" data-testid="chat-transcript-frame">
        <div>User: What is the current USD to EUR exchange rate?</div>
        <div>Assistant: Waiting for approval…</div>
      </div>
      <div class="decision" data-testid="chat-approval-shell">
        <div class="decision-title">Allow a web search?</div>
        <div data-testid="chat-human-review-panel" class="decision-body">
          <p class="summary">Search the web for: What is the current USD to EUR exchange rate?</p>
          <span>Show technical details</span>
          <div data-testid="review-decision-footer" class="actions">
            <button type="button">Approve once</button>
            <button type="button" class="outline">Skip this tool for this run</button>
          </div>
        </div>
      </div>
      <div class="composer" data-testid="chat-composer">Ask a question about your documents…</div>
    </div>
  </body>
</html>
