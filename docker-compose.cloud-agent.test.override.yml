# Optional test overrides for Cursor Cloud Agents (see scripts/cloud-agent-setup.sh tests-env).
# Mount host frontend/node_modules after npm ci on the VM; CI never loads this file.
services:
  frontend-test-runner:
    command:
    - npm test
    volumes:
    - ./frontend/node_modules:/workspace/frontend/node_modules:ro
  test-runner:
    volumes:
    - ./.askpdf-hf-cache:/models/hf
    environment:
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'