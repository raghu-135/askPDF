# CI overlay: use pre-built local tags from scripts/ci_docker_build.sh (no rebuild on test runners).
services:
  rag-service:
    image: askpdf-runtime-control-plane
  db-migrate:
    image: askpdf-runtime-control-plane
  langgraph-runtime:
    image: askpdf-langgraph-runtime
  runtime-db-migrate:
    image: askpdf-langgraph-runtime
  fake-llm:
    image: askpdf-fake-llm:ci
  hermes-upstream:
    image: askpdf-hermes-upstream:${HERMES_UPSTREAM_REVISION:?HERMES_UPSTREAM_REVISION must be set in .env}
  hermes:
    image: askpdf-hermes-gateway:ci
  hermes-runtime:
    image: askpdf-hermes-runtime:ci
  test-runner:
    image: askpdf-test-runner:ci
  runtime-test-runner:
    image: askpdf-langgraph-runtime-tests