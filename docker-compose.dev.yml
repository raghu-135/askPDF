services:
  # The runtime deliberately does not inherit the product .env. Keep this
  # allowlist limited to runtime execution, provider, and protocol settings.
  langgraph-runtime:
    environment:
      ASKPDF_AGENT_CHECKPOINTER: postgres
      ASKPDF_AGENT_CHECKPOINTER_SETUP: ${ASKPDF_AGENT_CHECKPOINTER_SETUP:-true}
      AGENT_CHECKPOINT_DATABASE_URL: ${AGENT_CHECKPOINT_DATABASE_URL:-postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints}
      AGENT_RUNTIME_EXECUTION_DATABASE_URL: ${AGENT_RUNTIME_EXECUTION_DATABASE_URL:-postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints}
      LANGGRAPH_RUNTIME_TOKEN: ${LANGGRAPH_RUNTIME_TOKEN:?LANGGRAPH_RUNTIME_TOKEN must be set in .env}
      LANGGRAPH_RUNTIME_BINDING_SECRET: ${LANGGRAPH_RUNTIME_BINDING_SECRET:?LANGGRAPH_RUNTIME_BINDING_SECRET must be set in .env}
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:1234/v1}
      # This is a container-to-container address.  Do not inherit the host
      # development value (usually 127.0.0.1), which points back at the
      # langgraph-runtime container and makes dependency admission fail.
      MCP_TRANSPORT: loopback_http
      MCP_LOOPBACK_URL: http://rag-service:8000/internal/mcp/
      MCP_REQUEST_TIMEOUT_SECONDS: ${MCP_REQUEST_TIMEOUT_SECONDS:-600}
      MCP_OTEL_ENABLED: ${MCP_OTEL_ENABLED:-false}
      AGENT_RUNTIME_LEASE_SECONDS: ${AGENT_RUNTIME_LEASE_SECONDS:-120}
      AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS: ${AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS:-30}
      AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS: ${AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS:-300}
      AGENT_RUNTIME_READ_TIMEOUT_SECONDS: ${AGENT_RUNTIME_READ_TIMEOUT_SECONDS:-600}
      AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS: ${AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS:-120}
      AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS: ${AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS:-120}
      AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS: ${AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS:-120}
      AGENT_EVENT_POLL_INTERVAL_SECONDS: ${AGENT_EVENT_POLL_INTERVAL_SECONDS:-1}
      AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS: ${AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS:-12}
      AGENT_CANCELLATION_POLL_INTERVAL_SECONDS: ${AGENT_CANCELLATION_POLL_INTERVAL_SECONDS:-0.5}
      AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS: ${AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS:-30}
      AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS: ${AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS:-60}
      AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS: ${AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS:-180}
      AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO: ${AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO:-0.1}
      AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS: ${AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS:-30}
      AGENT_RUNTIME_RECOVERY_BATCH_SIZE: ${AGENT_RUNTIME_RECOVERY_BATCH_SIZE:-100}
      AGENT_RUNTIME_RECOVERY_LOOP_ENABLED: ${AGENT_RUNTIME_RECOVERY_LOOP_ENABLED:-true}
      AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS: ${AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS:-10}
      AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS: ${AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS:-1}
      AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS: ${AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS:-600}
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS: ${AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS:-0.5}
      AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES: ${AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES:-8192}
      NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS: ${NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS:-2000}
      NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS: ${NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS:-2000}
      DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS: ${DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS:-10000}
      DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS: ${DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS:-500000}
      DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS: ${DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS:-100}
      DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS: ${DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS:-7200000}
      DEEP_AGENT_LANGGRAPH_MAX_DURATION_MS: ${DEEP_AGENT_LANGGRAPH_MAX_DURATION_MS:-7200000}
      DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS: ${DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS:-50000}
      DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT: ${DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT:-5000}
      DEEP_AGENT_LANGGRAPH_WAKE_LIMIT_SECONDS: ${DEEP_AGENT_LANGGRAPH_WAKE_LIMIT_SECONDS:-3600}
      DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS: ${DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS:-600000}
      DEEP_AGENT_LANGGRAPH_DISPATCH_TIMEOUT_MS: ${DEEP_AGENT_LANGGRAPH_DISPATCH_TIMEOUT_MS:-600000}
      DEEP_AGENT_LANGGRAPH_WORKER_TIMEOUT_MS: ${DEEP_AGENT_LANGGRAPH_WORKER_TIMEOUT_MS:-600000}
      DEEP_AGENT_LANGGRAPH_WEB_WORKER_TIMEOUT_MS: ${DEEP_AGENT_LANGGRAPH_WEB_WORKER_TIMEOUT_MS:-600000}

  hermes-config-init:
    environment:
      HERMES_DATA_ROOT: /opt/data
      HERMES_MODEL_CONTEXT_LENGTH: ${HERMES_MODEL_CONTEXT_LENGTH:-32768}
      HERMES_MODEL_PROVIDER: ${HERMES_MODEL_PROVIDER:-lmstudio}
      HERMES_MCP_CONTEXT_SECRET: ${HERMES_MCP_CONTEXT_SECRET:?HERMES_MCP_CONTEXT_SECRET must be set in .env}
      HERMES_PROFILE_ROOT: /opt/data/profiles
      HERMES_PROFILE_UID: ${HERMES_PROFILE_UID:-10000}
      HERMES_PROFILE_GID: ${HERMES_PROFILE_GID:-10000}
      HERMES_UPSTREAM_REVISION: ${HERMES_UPSTREAM_REVISION:?HERMES_UPSTREAM_REVISION must be set in .env}
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY must be set in .env}

  hermes:
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:?API_SERVER_KEY must be set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:1234/v1}
      HERMES_MODEL_CONTEXT_LENGTH: ${HERMES_MODEL_CONTEXT_LENGTH:-32768}
      HERMES_MODEL_PROVIDER: ${HERMES_MODEL_PROVIDER:-lmstudio}
      HERMES_MCP_CONTEXT_SECRET: ${HERMES_MCP_CONTEXT_SECRET:?HERMES_MCP_CONTEXT_SECRET must be set in .env}
      GATEWAY_MULTIPLEX_PROFILES: "true"
      ASKPDF_HERMES_COMPAT_ENABLED: "1"
      PYTHONPATH: /opt/askpdf-hermes-pinned-patch

  hermes-runtime:
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HERMES_API_URL: http://hermes:8642
      HERMES_API_TOKEN: ${API_SERVER_KEY:?API_SERVER_KEY must be set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:1234/v1}
      ASKPDF_MCP_URL: http://rag-service:8000/internal/mcp/
      ASKPDF_MCP_HEALTH_URL: http://rag-service:8000/health
      ASKPDF_MCP_REQUIRED: ${ASKPDF_MCP_REQUIRED:-true}
      HERMES_MCP_CONTEXT_SECRET: ${HERMES_MCP_CONTEXT_SECRET:?HERMES_MCP_CONTEXT_SECRET must be set in .env}
      HERMES_RUNTIME_VERSION: ${HERMES_RUNTIME_VERSION:-hermes-gateway-1}
      HERMES_RUNTIME_STATE_PATH: ${HERMES_RUNTIME_STATE_PATH:-/var/lib/hermes/runtime-state.json}
      HERMES_RUNTIME_STORAGE_BACKEND: ${HERMES_RUNTIME_STORAGE_BACKEND:-file}
      HERMES_RUNTIME_EVENT_ID_MODE: ${HERMES_RUNTIME_EVENT_ID_MODE:-durable}
      HERMES_RUNTIME_WORKERS: ${HERMES_RUNTIME_WORKERS:-1}
      HERMES_MODEL_CONTEXT_LENGTH: ${HERMES_MODEL_CONTEXT_LENGTH:-32768}
      HERMES_MODEL_PROVIDER: ${HERMES_MODEL_PROVIDER:-lmstudio}
      HERMES_PROFILE_ROOT: /opt/data/profiles
      HERMES_PROFILE_UID: ${HERMES_PROFILE_UID:-10000}
      HERMES_PROFILE_GID: ${HERMES_PROFILE_GID:-10000}

  frontend:
    build:
      target: dev
    environment:
      NODE_ENV: development
    command: >
      sh -lc "if [ ! -x node_modules/.bin/next ] || [ package-lock.json -nt node_modules/.package-lock.json ] || [ ! -d node_modules/@tanstack/react-virtual ] || [ ! -d node_modules/@next/bundle-analyzer ]; then npm ci --no-audit --no-fund; fi; npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_next:
