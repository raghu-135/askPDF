x-env-secrets-entrypoint: &env-secrets-entrypoint
  ["/bin/sh", "/opt/askpdf/docker_load_env_secrets.sh"]

x-env-secret-mounts: &env-secret-mounts
  - ./scripts/docker_load_env_secrets.sh:/opt/askpdf/docker_load_env_secrets.sh:ro
  - env_secrets:/secrets:ro

x-askpdf-buildkit-registry-cache-from: &askpdf_buildkit_registry_cache_from
  - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF:-}
x-askpdf-buildkit-registry-cache-to: &askpdf_buildkit_registry_cache_to
  - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF},mode=max,compression=zstd,ignore-error=true

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: /api/backend
        NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS: ${NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS:?NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS must be set in .env}
        NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS: ${NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS:?NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS must be set in .env}
      cache_from:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF:-}
      cache_to:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF},mode=max,compression=zstd,ignore-error=true
    ports:
    - 3000:3000
    environment:
    - NEXT_PUBLIC_API_URL=/api/backend
    - ASKPDF_BACKEND_URL=http://rag-service:8000
    - ASKPDF_ADMIN_TOKEN=${ASKPDF_ADMIN_TOKEN:?ASKPDF_ADMIN_TOKEN must be set}
    env_file:
    - path: .env
      required: true
    entrypoint:
    - /bin/sh
    - /opt/askpdf/docker_load_env_secrets.sh
    command:
    - node
    - server.js
    volumes:
    - ./scripts/docker_load_env_secrets.sh:/opt/askpdf/docker_load_env_secrets.sh:ro
    - env_secrets:/secrets:ro
    depends_on:
      env-secrets:
        condition: service_completed_successfully
      rag-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
    - stack
  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
      args:
        DOWNLOAD_LOCAL_MODELS: 'false'
      cache_from:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF:-}
      cache_to:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF},mode=max,compression=zstd,ignore-error=true
    ports:
    - 127.0.0.1:8000:8000
    environment:
    - LOG_LEVEL=INFO
    - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
    - TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/test_askpdf
    - POSTGRES_POOL_SIZE=10
    - POSTGRES_MAX_OVERFLOW=20
    - WEAVIATE_URL=http://weaviate:8080
    - WEAVIATE_HYBRID_ALPHA=0.7
    - QUERY_DEFAULTS_LIMIT=20
    - CAPTURE_SERVICE_URL=http://browser-capture:8080
    - LOCAL_EMBEDDING_MODEL=BAAI/bge-m3
    - LOCAL_RERANKER_MODEL=BAAI/bge-reranker-v2-m3
    - EMBEDDING_DEVICE=cpu
    - RERANKER_DEVICE=cpu
    - LLM_API_URL=http://host.docker.internal:1234/v1
    - DEFAULT_TOKEN_BUDGET=8192
    - REPLANS_LIMIT=10
    - MAX_CUSTOM_INSTRUCTIONS_CHARS=2000
    - MAX_SYSTEM_ROLE_CHARS=500
    - MAX_TOOL_INSTRUCTION_CHARS=500
    - INTENT_AGENT_MAX_ITERATIONS=1
    - MAX_ITERATIONS_SUFFICIENT_COVERAGE=2
    - MAX_ITERATIONS_PROBABLY_SUFFICIENT_COVERAGE=4
    - WEB_SEARCH_ITERATION_BONUS=2
    - DOCLING_DO_OCR=False
    - DOCLING_DO_TABLE_STRUCTURE=True
    - DOCLING_TABLE_MODE=FAST
    - DOCLING_FORCE_FULL_PAGE_OCR=False
    - DOCLING_DO_FORMULA_ENRICHMENT=False
    - DOCLING_INFERENCE_COMPILE_TORCH_MODELS=False
    - AGENT_TASK_HEARTBEAT_INTERVAL_SECONDS=${AGENT_TASK_HEARTBEAT_INTERVAL_SECONDS:?AGENT_TASK_HEARTBEAT_INTERVAL_SECONDS must be set}
    - AGENT_TASK_CANCELLATION_RETRY_SECONDS=${AGENT_TASK_CANCELLATION_RETRY_SECONDS:?AGENT_TASK_CANCELLATION_RETRY_SECONDS must be set}
    - AGENT_TASK_MAINTENANCE_INTERVAL_SECONDS=${AGENT_TASK_MAINTENANCE_INTERVAL_SECONDS:?AGENT_TASK_MAINTENANCE_INTERVAL_SECONDS must be set}
    - AGENT_TASK_MAINTENANCE_BATCH_SIZE=${AGENT_TASK_MAINTENANCE_BATCH_SIZE:?AGENT_TASK_MAINTENANCE_BATCH_SIZE must be set}
    - TASK_CHECKPOINT_RETENTION_DAYS=${TASK_CHECKPOINT_RETENTION_DAYS:?TASK_CHECKPOINT_RETENTION_DAYS must be set}
    - RUNTIME_OPERATION_LEASE_SECONDS=${RUNTIME_OPERATION_LEASE_SECONDS:?RUNTIME_OPERATION_LEASE_SECONDS must be set}
    - MEMORY_MAINTENANCE_INTERVAL_SECONDS=${MEMORY_MAINTENANCE_INTERVAL_SECONDS:?MEMORY_MAINTENANCE_INTERVAL_SECONDS must be set}
    - MEMORY_MAINTENANCE_BATCH_SIZE=${MEMORY_MAINTENANCE_BATCH_SIZE:?MEMORY_MAINTENANCE_BATCH_SIZE must be set}
    - MEMORY_MANAGER_MAX_TOOL_CALLS=${MEMORY_MANAGER_MAX_TOOL_CALLS:?MEMORY_MANAGER_MAX_TOOL_CALLS must be set}
    - MEMORY_MANAGER_MAX_WEB_CALLS=${MEMORY_MANAGER_MAX_WEB_CALLS:?MEMORY_MANAGER_MAX_WEB_CALLS must be set}
    env_file:
    - path: .env
      required: true
    entrypoint:
    - /bin/sh
    - /opt/askpdf/docker_load_env_secrets.sh
    command:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    depends_on:
      env-secrets:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      weaviate:
        condition: service_healthy
      langgraph-runtime:
        condition: service_healthy
    volumes:
    - ./scripts/docker_load_env_secrets.sh:/opt/askpdf/docker_load_env_secrets.sh:ro
    - env_secrets:/secrets:ro
    - ./rag_service:/app
    - ./data:/data
    - pdf_data:/static
    - browser_captures:/captures:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - sh
      - -c
      - curl -f http://localhost:8000/ready && curl -f http://weaviate:8080/v1/.well-known/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
    - stack
  langgraph-runtime:
    image: askpdf-langgraph-runtime
    build:
      context: .
      dockerfile: langgraph_runtime/Dockerfile
      cache_from:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF:-}
      cache_to:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF},mode=max,compression=zstd,ignore-error=true
    env_file: []
    environment:
    - LOG_LEVEL=INFO
    - MCP_TRANSPORT=loopback_http
    - MCP_LOOPBACK_URL=http://rag-service:8000/internal/mcp/
    - MCP_REQUEST_TIMEOUT_SECONDS=${MCP_REQUEST_TIMEOUT_SECONDS:?MCP_REQUEST_TIMEOUT_SECONDS must be set}
    - MCP_OTEL_ENABLED=${MCP_OTEL_ENABLED:?MCP_OTEL_ENABLED must be set}
    - LANGGRAPH_RUNTIME_TOKEN=${LANGGRAPH_RUNTIME_TOKEN:?LANGGRAPH_RUNTIME_TOKEN must be set}
    - LANGGRAPH_RUNTIME_BINDING_SECRET=${LANGGRAPH_RUNTIME_BINDING_SECRET:?LANGGRAPH_RUNTIME_BINDING_SECRET must be set}
    - ASKPDF_AGENT_CHECKPOINTER=${ASKPDF_AGENT_CHECKPOINTER:?ASKPDF_AGENT_CHECKPOINTER must be set}
    - ASKPDF_AGENT_CHECKPOINTER_SETUP=${ASKPDF_AGENT_CHECKPOINTER_SETUP:?ASKPDF_AGENT_CHECKPOINTER_SETUP must be set}
    - AGENT_CHECKPOINT_DATABASE_URL=${AGENT_CHECKPOINT_DATABASE_URL:?AGENT_CHECKPOINT_DATABASE_URL must be set}
    - AGENT_RUNTIME_EXECUTION_DATABASE_URL=${AGENT_RUNTIME_EXECUTION_DATABASE_URL:?AGENT_RUNTIME_EXECUTION_DATABASE_URL must be set}
    - LLM_API_URL=${LLM_API_URL:?LLM_API_URL must be set}
    - OPENAI_API_KEY=${OPENAI_API_KEY-}
    - DEFAULT_TOKEN_BUDGET=${DEFAULT_TOKEN_BUDGET:?DEFAULT_TOKEN_BUDGET must be set}
    - REPLANS_LIMIT=${REPLANS_LIMIT:?REPLANS_LIMIT must be set}
    - MAX_CUSTOM_INSTRUCTIONS_CHARS=${MAX_CUSTOM_INSTRUCTIONS_CHARS:?MAX_CUSTOM_INSTRUCTIONS_CHARS must be set}
    - MAX_SYSTEM_ROLE_CHARS=${MAX_SYSTEM_ROLE_CHARS:?MAX_SYSTEM_ROLE_CHARS must be set}
    - CONTEXT_USABLE_RATIO=${CONTEXT_USABLE_RATIO:?CONTEXT_USABLE_RATIO must be set}
    - CONTEXT_RECENT_RATIO=${CONTEXT_RECENT_RATIO:?CONTEXT_RECENT_RATIO must be set}
    - CONTEXT_SEMANTIC_RATIO=${CONTEXT_SEMANTIC_RATIO:?CONTEXT_SEMANTIC_RATIO must be set}
    - CONTEXT_DURABLE_MEMORY_RATIO=${CONTEXT_DURABLE_MEMORY_RATIO:?CONTEXT_DURABLE_MEMORY_RATIO must be set}
    - CONTEXT_DOCUMENT_RATIO=${CONTEXT_DOCUMENT_RATIO:?CONTEXT_DOCUMENT_RATIO must be set}
    - CONTEXT_MEMORY_EXPANDED_RATIO=${CONTEXT_MEMORY_EXPANDED_RATIO:?CONTEXT_MEMORY_EXPANDED_RATIO must be set}
    - CONTEXT_EVIDENCE_RATIO=${CONTEXT_EVIDENCE_RATIO:?CONTEXT_EVIDENCE_RATIO must be set}
    - CONTEXT_DRAFT_RATIO=${CONTEXT_DRAFT_RATIO:?CONTEXT_DRAFT_RATIO must be set}
    - CONTEXT_PLAN_SECTION_RATIO=${CONTEXT_PLAN_SECTION_RATIO:?CONTEXT_PLAN_SECTION_RATIO must be set}
    - CONTEXT_PLAN_TOTAL_RATIO=${CONTEXT_PLAN_TOTAL_RATIO:?CONTEXT_PLAN_TOTAL_RATIO must be set}
    - CONTEXT_PLAN_MEMORY_RATIO=${CONTEXT_PLAN_MEMORY_RATIO:?CONTEXT_PLAN_MEMORY_RATIO must be set}
    - AGENT_RUNTIME_LEASE_SECONDS=${AGENT_RUNTIME_LEASE_SECONDS:?AGENT_RUNTIME_LEASE_SECONDS must be set}
    - AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS=${AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS:?AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS must be set}
    - AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS=${AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS:?AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS must be set}
    - AGENT_RUNTIME_READ_TIMEOUT_SECONDS=${AGENT_RUNTIME_READ_TIMEOUT_SECONDS:?AGENT_RUNTIME_READ_TIMEOUT_SECONDS must be set}
    - AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS=${AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS:?AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS must be set}
    - AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS=${AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS:?AGENT_RUNTIME_CANCEL_CONFIRM_TIMEOUT_SECONDS must be set}
    - AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS=${AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS:?AGENT_RUNTIME_TERMINAL_CONFIRM_TIMEOUT_SECONDS must be set}
    - AGENT_EVENT_POLL_INTERVAL_SECONDS=${AGENT_EVENT_POLL_INTERVAL_SECONDS:?AGENT_EVENT_POLL_INTERVAL_SECONDS must be set}
    - AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS=${AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS:?AGENT_SSE_HEARTBEAT_INTERVAL_SECONDS must be set}
    - AGENT_CANCELLATION_POLL_INTERVAL_SECONDS=${AGENT_CANCELLATION_POLL_INTERVAL_SECONDS:?AGENT_CANCELLATION_POLL_INTERVAL_SECONDS must be set}
    - AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS=${AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS:?AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS must be set}
    - AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS=${AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS:?AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS must be set}
    - AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS=${AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS:?AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS must be set}
    - AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO=${AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO:?AGENT_RUNTIME_DEPENDENCY_JITTER_RATIO must be set}
    - AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS=${AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS:?AGENT_RUNTIME_RECOVERY_INTERVAL_SECONDS must be set}
    - AGENT_RUNTIME_RECOVERY_BATCH_SIZE=${AGENT_RUNTIME_RECOVERY_BATCH_SIZE:?AGENT_RUNTIME_RECOVERY_BATCH_SIZE must be set}
    - AGENT_RUNTIME_RECOVERY_LOOP_ENABLED=${AGENT_RUNTIME_RECOVERY_LOOP_ENABLED:?AGENT_RUNTIME_RECOVERY_LOOP_ENABLED must be set}
    - AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS=${AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS:?AGENT_RUNTIME_RECONNECT_MAX_ATTEMPTS must be set}
    - AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS=${AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS:?AGENT_RUNTIME_RECONNECT_BACKOFF_SECONDS must be set}
    - AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS=${AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS:?AGENT_RUNTIME_RECONNECT_DEADLINE_SECONDS must be set}
    - AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS=${AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS:?AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_SECONDS must be set}
    - AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES=${AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES:?AGENT_RUNTIME_OUTPUT_DELTA_FLUSH_BYTES must be set}
    - NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS=${NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS:?NEXT_PUBLIC_AGENT_TASK_POLL_INTERVAL_MS must be set}
    - NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS=${NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS:?NEXT_PUBLIC_AGENT_SSE_RECONNECT_INTERVAL_MS must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS=${DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS:?DEEP_AGENT_LANGGRAPH_MAX_MODEL_CALLS must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS=${DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS:?DEEP_AGENT_LANGGRAPH_MAX_MODEL_TOKENS must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS=${DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS:?DEEP_AGENT_LANGGRAPH_MAX_TOOL_CALLS must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS=${DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS:?DEEP_AGENT_LANGGRAPH_MAX_ACTIVE_RUNTIME_MS must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_DURATION_MS=${DEEP_AGENT_LANGGRAPH_MAX_DURATION_MS:?DEEP_AGENT_LANGGRAPH_MAX_DURATION_MS must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS=${DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS:?DEEP_AGENT_LANGGRAPH_MAX_OUTPUT_CHARS must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT=${DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT:?DEEP_AGENT_LANGGRAPH_MAX_EVENT_COUNT must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_PLAN_ATTEMPTS=${DEEP_AGENT_LANGGRAPH_MAX_PLAN_ATTEMPTS:?DEEP_AGENT_LANGGRAPH_MAX_PLAN_ATTEMPTS must be set}
    - DEEP_AGENT_LANGGRAPH_MAX_PLAN_VALIDATION_ERRORS=${DEEP_AGENT_LANGGRAPH_MAX_PLAN_VALIDATION_ERRORS:?DEEP_AGENT_LANGGRAPH_MAX_PLAN_VALIDATION_ERRORS must be set}
    - DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS=${DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS:?DEEP_AGENT_LANGGRAPH_SUBAGENT_TIMEOUT_MS must be set}
    - DEEP_AGENT_LANGGRAPH_DISPATCH_TIMEOUT_MS=${DEEP_AGENT_LANGGRAPH_DISPATCH_TIMEOUT_MS:?DEEP_AGENT_LANGGRAPH_DISPATCH_TIMEOUT_MS must be set}
    - DEEP_AGENT_LANGGRAPH_WORKER_TIMEOUT_MS=${DEEP_AGENT_LANGGRAPH_WORKER_TIMEOUT_MS:?DEEP_AGENT_LANGGRAPH_WORKER_TIMEOUT_MS must be set}
    - DEEP_AGENT_LANGGRAPH_WEB_WORKER_TIMEOUT_MS=${DEEP_AGENT_LANGGRAPH_WEB_WORKER_TIMEOUT_MS:?DEEP_AGENT_LANGGRAPH_WEB_WORKER_TIMEOUT_MS must be set}
    entrypoint: *env-secrets-entrypoint
    command:
    - uvicorn
    - langgraph_runtime.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8100'
    volumes:
    - ./scripts/docker_load_env_secrets.sh:/opt/askpdf/docker_load_env_secrets.sh:ro
    - env_secrets:/secrets:ro
    depends_on:
      env-secrets:
        condition: service_completed_successfully
      runtime-db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8100/startupz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
    - stack
  hermes-config-init:
    profiles:
    - hermes
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile
    command:
    - python
    - -m
    - hermes_runtime.profile_manager
    environment:
    - HERMES_DATA_ROOT=/opt/data
    - HERMES_CONFIG_TEMPLATE_ROOT=/app/hermes_runtime
    - HERMES_MODEL_CONTEXT_LENGTH=${HERMES_MODEL_CONTEXT_LENGTH:?HERMES_MODEL_CONTEXT_LENGTH must be set in .env}
    - HERMES_GATEWAY_HOME=/opt/data
    - HERMES_PROFILE_ROOT=${HERMES_PROFILE_ROOT:?HERMES_PROFILE_ROOT must be set in .env}
    - HERMES_PROFILE_UID=${HERMES_PROFILE_UID:?HERMES_PROFILE_UID must be set in .env}
    - HERMES_PROFILE_GID=${HERMES_PROFILE_GID:?HERMES_PROFILE_GID must be set in .env}
    - HERMES_API_TOKEN=${HERMES_API_TOKEN:?HERMES_API_TOKEN must be set in .env}
    - LLM_API_URL=${LLM_API_URL:?LLM_API_URL must be set in .env}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    env_file: []
    entrypoint: *env-secrets-entrypoint
    depends_on:
      env-secrets:
        condition: service_completed_successfully
    volumes:
    - ./scripts/docker_load_env_secrets.sh:/opt/askpdf/docker_load_env_secrets.sh:ro
    - env_secrets:/secrets:ro
    - hermes_data:/opt/data
  hermes-upstream:
    profiles:
    - hermes
    image: askpdf-hermes-upstream:${HERMES_UPSTREAM_REVISION:?HERMES_UPSTREAM_REVISION must be set in .env}
    build:
      context: https://github.com/NousResearch/hermes-agent.git#${HERMES_UPSTREAM_REVISION:?HERMES_UPSTREAM_REVISION must be set in .env}
      cache_from:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF:-}
      cache_to:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF},mode=max,compression=zstd,ignore-error=true
    entrypoint:
    - /bin/true
  hermes:
    profiles:
    - hermes
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile.gateway
      additional_contexts:
        hermes-upstream: service:hermes-upstream
      cache_from:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF:-}
      cache_to:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF},mode=max,compression=zstd,ignore-error=true
    environment:
    - API_SERVER_ENABLED=true
    - API_SERVER_HOST=0.0.0.0
    - API_SERVER_PORT=8642
    - GATEWAY_MULTIPLEX_PROFILES=true
    - ASKPDF_HERMES_COMPAT_ENABLED=1
    - HERMES_UPSTREAM_REVISION=${HERMES_UPSTREAM_REVISION:?HERMES_UPSTREAM_REVISION must be set in .env}
    - PYTHONPATH=/opt/askpdf-hermes-pinned-patch:/opt/askpdf-pylib
    - API_SERVER_KEY=${HERMES_API_TOKEN:?HERMES_API_TOKEN must be set in .env}
    - LLM_API_URL=${LLM_API_URL:?LLM_API_URL must be set in .env}
    - OPENAI_BASE_URL=${LLM_API_URL:?LLM_API_URL must be set in .env}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - ASKPDF_OPENROUTER_USAGE_ACCOUNTING=${ASKPDF_OPENROUTER_USAGE_ACCOUNTING:-1}
    env_file: []
    entrypoint:
    - /bin/sh
    - /opt/askpdf/docker_load_env_secrets.sh
    - /opt/hermes/docker/entrypoint-dispatch.sh
    command:
    - gateway
    depends_on:
      env-secrets:
        condition: service_completed_successfully
      hermes-upstream:
        condition: service_completed_successfully
      hermes-config-init:
        condition: service_completed_successfully
      rag-service:
        condition: service_started
    volumes:
    - ./scripts/docker_load_env_secrets.sh:/opt/askpdf/docker_load_env_secrets.sh:ro
    - env_secrets:/secrets:ro
    - hermes_data:/opt/data
    - ./hermes_runtime/hermes_pinned_patch:/opt/askpdf-hermes-pinned-patch:ro
    - ./runtime_protocol:/opt/askpdf-pylib/runtime_protocol:ro
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8642/health
      interval: 10s
      timeout: 5s
      retries: 30
  hermes-runtime:
    profiles:
    - hermes
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile
      cache_from:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF:-}
      cache_to:
      - type=registry,ref=${ASKPDF_BUILDKIT_CACHE_REF},mode=max,compression=zstd,ignore-error=true
    environment:
    - LOG_LEVEL=INFO
    - HERMES_API_URL=http://hermes:8642
    - ASKPDF_MCP_URL=http://rag-service:8000/internal/mcp/
    - ASKPDF_MCP_HEALTH_URL=http://rag-service:8000/health
    - HERMES_RUNTIME_TOKEN=${HERMES_RUNTIME_TOKEN:?HERMES_RUNTIME_TOKEN must be set in .env}
    - HERMES_API_TOKEN=${HERMES_API_TOKEN:?HERMES_API_TOKEN must be set in .env}
    - ASKPDF_MCP_REQUIRED=${ASKPDF_MCP_REQUIRED:?ASKPDF_MCP_REQUIRED must be set in .env}
    - HERMES_UPSTREAM_REVISION=${HERMES_UPSTREAM_REVISION:?HERMES_UPSTREAM_REVISION must be set in .env}
    - HERMES_MODEL_CONTEXT_LENGTH=${HERMES_MODEL_CONTEXT_LENGTH:?HERMES_MODEL_CONTEXT_LENGTH must be set in .env}
    - HERMES_RUNTIME_VERSION=${HERMES_RUNTIME_VERSION:?HERMES_RUNTIME_VERSION must be set in .env}
