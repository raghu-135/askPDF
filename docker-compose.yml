services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      rag-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  rag-service:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/test_askpdf
      - POSTGRES_POOL_SIZE=10
      - POSTGRES_MAX_OVERFLOW=20
      - ASKPDF_AGENT_CHECKPOINTER=postgres
      - AGENT_RUNTIME_MODE=${AGENT_RUNTIME_MODE:-external}
      - LANGGRAPH_RUNTIME_URL=http://langgraph-runtime:8100
      - HERMES_RUNTIME_ENABLED=true
      - HERMES_RUNTIME_URL=http://hermes-runtime:8200
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_HYBRID_ALPHA=${WEAVIATE_HYBRID_ALPHA:-0.7}
      - CAPTURE_SERVICE_URL=http://browser-capture:8080
      - MCP_TRANSPORT=${MCP_TRANSPORT:-in_process}
      - MCP_LOOPBACK_URL=${MCP_LOOPBACK_URL:-http://127.0.0.1:8000/internal/mcp/}
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgresql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      weaviate:
        condition: service_healthy
    volumes:
      - ./rag_service:/app
      - ./data:/data
      - pdf_data:/static
      - browser_captures:/captures:ro  # Read access to browser captures
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl -f http://localhost:8000/health && curl -f http://weaviate:8080/v1/.well-known/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3

  langgraph-runtime:
    build:
      context: ./rag_service
      dockerfile: runtime_service/Dockerfile
    environment:
      - LOG_LEVEL=INFO
      - ASKPDF_AGENT_CHECKPOINTER=postgres
      - AGENT_CHECKPOINT_DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints
      - AGENT_RUNTIME_EXECUTION_DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints
      - ASKPDF_AGENT_CHECKPOINTER_SETUP=true
      - ASKPDF_AGENT_CHECKPOINTER_ALLOW_MEMORY_FALLBACK=false
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_HYBRID_ALPHA=${WEAVIATE_HYBRID_ALPHA:-0.7}
      - MCP_TRANSPORT=loopback_http
      - MCP_LOOPBACK_URL=http://rag-service:8000/internal/mcp/
      - AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS=${AGENT_RUNTIME_CONNECT_TIMEOUT_SECONDS:-5}
      - AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS=${AGENT_RUNTIME_WRITE_TIMEOUT_SECONDS:-10}
      - AGENT_RUNTIME_READ_TIMEOUT_SECONDS=${AGENT_RUNTIME_READ_TIMEOUT_SECONDS:-30}
      - AGENT_RUNTIME_EXECUTION_TIMEOUT_SECONDS=${AGENT_RUNTIME_EXECUTION_TIMEOUT_SECONDS:-3600}
      - AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS=${AGENT_RUNTIME_SHUTDOWN_GRACE_SECONDS:-30}
      - AGENT_RUNTIME_MCP_READY_TIMEOUT_SECONDS=${AGENT_RUNTIME_MCP_READY_TIMEOUT_SECONDS:-5}
      - AGENT_RUNTIME_PROVIDER_READY_TIMEOUT_SECONDS=${AGENT_RUNTIME_PROVIDER_READY_TIMEOUT_SECONDS:-10}
      - AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS=${AGENT_RUNTIME_DEPENDENCY_REFRESH_SECONDS:-30}
      - AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS=${AGENT_RUNTIME_DEPENDENCY_TIMEOUT_SECONDS:-5}
      - AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS=${AGENT_RUNTIME_DEPENDENCY_STALE_SECONDS:-90}
      - AGENT_RUNTIME_LEGACY_STRICT_READINESS=${AGENT_RUNTIME_LEGACY_STRICT_READINESS:-false}
      - RUNTIME_PROVIDER_VERSION=${RUNTIME_PROVIDER_VERSION:-langgraph-inprocess-1}
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      runtime-checkpoint-db-init:
        condition: service_completed_successfully
      runtime-db-migrate:
        condition: service_completed_successfully
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  hermes:
    build:
      context: https://github.com/NousResearch/hermes-agent.git#bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY:?API_SERVER_KEY must be set in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-askpdf-local-provider}
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: true
    command: ["gateway"]
    depends_on:
      rag-service:
        condition: service_healthy
    volumes:
      - ./hermes_runtime/config.yaml:/opt/data/config.yaml:ro
      - ./.env:/opt/data/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  hermes-runtime:
    build:
      context: .
      dockerfile: hermes_runtime/Dockerfile
    environment:
      - LOG_LEVEL=INFO
      - HERMES_API_URL=http://hermes:8642
      - ASKPDF_MCP_URL=${ASKPDF_MCP_URL:-http://rag-service:8000/internal/mcp/}
      - ASKPDF_MCP_HEALTH_URL=${ASKPDF_MCP_HEALTH_URL:-http://rag-service:8000/health}
      - ASKPDF_MCP_REQUIRED=${ASKPDF_MCP_REQUIRED:-true}
      - HERMES_MCP_ALLOWED_TOOLS=${HERMES_MCP_ALLOWED_TOOLS:-document_evidence,thread_conversation_history,clarify_intent}
      - HERMES_API_TOKEN=${API_SERVER_KEY:?API_SERVER_KEY must be set in .env}
      - HERMES_RUNTIME_VERSION=${HERMES_RUNTIME_VERSION:-hermes-gateway-1}
      - HERMES_UPSTREAM_REVISION=${HERMES_UPSTREAM_REVISION:-bdd0a79c6a0ebc2344d5d6913c70bd89fa59c894}
      - HERMES_RUNTIME_READ_TIMEOUT_SECONDS=${HERMES_RUNTIME_READ_TIMEOUT_SECONDS:-30}
      - HERMES_RUNTIME_STATE_PATH=/var/lib/hermes/runtime-state.json
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      hermes:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - hermes_runtime_state:/var/lib/hermes

  runtime-checkpoint-db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        until pg_isready -h postgresql -U postgres -d askpdf; do sleep 1; done;
        if [ "$$(psql -h postgresql -U postgres -d askpdf -tAc "SELECT 1 FROM pg_database WHERE datname='runtime_checkpoints'")" != "1" ]; then
          createdb -h postgresql -U postgres runtime_checkpoints;
        fi

  runtime-db-migrate:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    command: ["python", "-m", "app.db.migrate_runtime"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/runtime_checkpoints
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/runtime_checkpoints
      POSTGRES_POOL_SIZE: "1"
      POSTGRES_MAX_OVERFLOW: "1"
      AGENT_RUNTIME_EXECUTION_DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/runtime_checkpoints
      RUN_RUNTIME_DB_MIGRATIONS: ${RUN_RUNTIME_DB_MIGRATIONS:-true}
    depends_on:
      runtime-checkpoint-db-init:
        condition: service_completed_successfully
    volumes:
      - ./rag_service:/app

  db-migrate:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    command: ["python", "-m", "app.db.migrate"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/test_askpdf
      - POSTGRES_POOL_SIZE=10
      - POSTGRES_MAX_OVERFLOW=20
      - RUN_DB_MIGRATIONS=${RUN_DB_MIGRATIONS:-true}
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_HYBRID_ALPHA=${WEAVIATE_HYBRID_ALPHA:-0.7}
      - CAPTURE_SERVICE_URL=http://browser-capture:8080
      - MCP_TRANSPORT=${MCP_TRANSPORT:-in_process}
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./rag_service:/app

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.2
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=${QUERY_DEFAULTS_LIMIT:-20}
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_API_BASED_MODULES=true
      - CLUSTER_HOSTNAME=node1
    healthcheck:
      #test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready" ]
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - weaviate_data:/var/lib/weaviate

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: askpdf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askpdf"]
      interval: 5s
      timeout: 5s
      retries: 5

  browser-capture:
    build:
      context: ./browser_capture
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8090:3000"  # Browser web UI for iframe access (localhost only)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # CDP is loopback-only inside this container; rag-service talks to the capture API over Docker DNS.
      - BRAVE_CLI=--remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --no-first-run --no-default-browser-check
      - BROWSER_DEBUG_URL=127.0.0.1:9222
      - CUSTOM_PORT=3000
      # Enable Selkies clipboard functionality
      - SELKIES_CLIPBOARD_ENABLED=${SELKIES_CLIPBOARD_ENABLED:-true}
      - SELKIES_CLIPBOARD_BRIDGE_ENABLED=${SELKIES_CLIPBOARD_BRIDGE_ENABLED:-true}
      # Disable Selkies gaming features
      - SELKIES_GAMEPAD_ENABLED=${SELKIES_GAMEPAD_ENABLED:-false}
      - SELKIES_UI_SIDEBAR_SHOW_GAMEPADS=${SELKIES_UI_SIDEBAR_SHOW_GAMEPADS:-false}
      - SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE=${SELKIES_UI_SIDEBAR_SHOW_GAMING_MODE:-false}
      # Disable Selkies sharing features  
      - SELKIES_UI_SIDEBAR_SHOW_SHARING=${SELKIES_UI_SIDEBAR_SHOW_SHARING:-false}
      # Disable Selkies apps features
      - SELKIES_UI_SIDEBAR_SHOW_APPS=${SELKIES_UI_SIDEBAR_SHOW_APPS:-false}
    shm_size: '2gb'
    volumes:
      - browser_captures:/captures
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  weaviate_data:
  pdf_data:
  postgres_data:
  browser_captures:
  hermes_runtime_state:
