services:
  frontend-test-runner:
    image: node:22-bookworm-slim
    working_dir: /workspace/frontend
    entrypoint: ["sh", "-c"]
    command: ["npm ci --ignore-scripts && npm test"]
    volumes:
      - ./frontend/package.json:/workspace/frontend/package.json:ro
      - ./frontend/package-lock.json:/workspace/frontend/package-lock.json:ro
      - ./frontend/src:/workspace/frontend/src:ro
      - ./frontend/tests:/workspace/frontend/tests:ro
      - ./docker-compose.dev.yml:/workspace/docker-compose.dev.yml:ro
      - ./rag_service/app/workflow_catalog/builtins:/workspace/rag_service/app/workflow_catalog/builtins:ro
      - frontend_test_node_modules:/workspace/frontend/node_modules

  test-runner:
    build:
      context: .
      dockerfile: rag_service/Dockerfile.test
    entrypoint: ["python", "scripts/run_tests.py"]
    env_file:
      - path: .env
        required: true
    environment:
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/askpdf
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgresql:5432/test_askpdf
      - POSTGRES_POOL_SIZE=10
      - POSTGRES_MAX_OVERFLOW=20
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_HYBRID_ALPHA=0.7
      - QUERY_DEFAULTS_LIMIT=20
      - CAPTURE_SERVICE_URL=http://browser-capture:8080
      - AGENT_TASK_HEARTBEAT_INTERVAL_SECONDS=15
      - AGENT_TASK_CANCELLATION_RETRY_SECONDS=2
      - AGENT_TASK_MAINTENANCE_INTERVAL_SECONDS=60
      - AGENT_TASK_MAINTENANCE_BATCH_SIZE=100
      - TASK_CHECKPOINT_RETENTION_DAYS=7
      - RUNTIME_OPERATION_LEASE_SECONDS=300
      - MEMORY_MAINTENANCE_INTERVAL_SECONDS=300
      - MEMORY_MAINTENANCE_BATCH_SIZE=100
      - MEMORY_MANAGER_MAX_TOOL_CALLS=4
      - MEMORY_MANAGER_MAX_WEB_CALLS=2
      - LOCAL_EMBEDDING_MODEL=BAAI/bge-m3
      - LOCAL_RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      - EMBEDDING_DEVICE=cpu
      - RERANKER_DEVICE=cpu
      - LLM_API_URL=http://host.docker.internal:1234/v1
      - LLM_AUTH_MODE=none
      - LLM_KEYLESS_PROVIDER=local
      - OPENAI_API_KEY=
      - LANGGRAPH_RUNTIME_TOKEN=test-langgraph-runtime-token-32-characters
      - MCP_TRANSPORT=in_process
      - MCP_LOOPBACK_URL=http://127.0.0.1:8000/internal/mcp/
      - ASKPDF_MCP_URL=http://127.0.0.1:8000/internal/mcp/
      - ASKPDF_MCP_HEALTH_URL=http://127.0.0.1:8000/health
      - DEFAULT_TOKEN_BUDGET=8192
      - REPLANS_LIMIT=10
      - MAX_CUSTOM_INSTRUCTIONS_CHARS=2000
      - MAX_SYSTEM_ROLE_CHARS=500
      - MAX_TOOL_INSTRUCTION_CHARS=500
      - INTENT_AGENT_MAX_ITERATIONS=1
      - MAX_ITERATIONS_SUFFICIENT_COVERAGE=2
      - MAX_ITERATIONS_PROBABLY_SUFFICIENT_COVERAGE=4
      - WEB_SEARCH_ITERATION_BONUS=2
      - DOCLING_DO_OCR=False
      - DOCLING_DO_TABLE_STRUCTURE=True
      - DOCLING_TABLE_MODE=FAST
      - DOCLING_FORCE_FULL_PAGE_OCR=False
      - DOCLING_DO_FORMULA_ENRICHMENT=False
      - ASKPDF_REPO_DIR=/workspace
      - PYTHONPATH=/app
    depends_on:
      postgresql:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    volumes:
      - .:/workspace:ro
      - test_data:/data
      - content_test_data:/static
    extra_hosts:
      - "host.docker.internal:host-gateway"

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.2
    environment:
      - QUERY_DEFAULTS_LIMIT=20
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_API_BASED_MODULES=true
      - CLUSTER_HOSTNAME=node1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - weaviate_test_data:/var/lib/weaviate

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: askpdf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askpdf"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  frontend_test_node_modules:
  postgres_test_data:
  test_data:
  weaviate_test_data:
  content_test_data:
